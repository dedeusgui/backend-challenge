name: Bun checks
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # The static showcase test needs the review base commit, so this job needs full history.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The same compose file as local development, so queues use the same init script.
      - name: Start PostgreSQL and LocalStack
        run: bun run infra:up
      - name: Full gate (typecheck, lint, format, unit, integration, concurrency, e2e, features)
        run: bun run check:all
      - name: Capture service diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci-compose-diagnostics"
          docker compose ps --all > "$RUNNER_TEMP/ci-compose-diagnostics/compose-ps.txt" || true
          docker compose logs --timestamps --no-color > "$RUNNER_TEMP/ci-compose-diagnostics/compose.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-compose-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-compose-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Stop infrastructure
        if: always()
        run: docker compose down -v --remove-orphans

  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start PostgreSQL, LocalStack, migrations, API and worker
        run: docker compose up --build --detach --wait
      - name: Exercise the financial API flow
        run: bun run demo:finance
        env:
          API_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://wagering:wagering@127.0.0.1:5432/wagering
      - name: Capture runtime smoke diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-smoke-diagnostics"
          docker compose ps --all > "$RUNNER_TEMP/runtime-smoke-diagnostics/compose-ps.txt" || true
          docker compose logs --timestamps --no-color > "$RUNNER_TEMP/runtime-smoke-diagnostics/compose.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runtime-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Stop runtime stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the API image from the Dockerfile in this repository
        run: docker build -t wagering-api:ci .
      - name: Scan the API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: wagering-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
