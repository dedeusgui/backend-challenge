name: CI gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # The showcase test reads the review range, so it needs complete history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start PostgreSQL and LocalStack
        run: bun run infra:up
      - name: Check for dead code
        id: deadcode
        continue-on-error: true
        run: bun run deadcode:check
      - name: Run the complete check:all gate
        id: full-gate
        continue-on-error: true
        run: |
          set +e
          bun run check:all 2>&1 | tee "$RUNNER_TEMP/check-all.log"
          check_status=${PIPESTATUS[0]}
          set -e
          printf '\ncheck:all exit=%s\n' "$check_status" >> "$RUNNER_TEMP/check-all.log"
          exit "$check_status"
      - name: Record commit-bound gate evidence
        if: always()
        run: >-
          bun run gate:registrar "$RUNNER_TEMP/check-all.log" "$GITHUB_SHA"
          "github-actions/ubuntu-latest" "$RUNNER_TEMP/ultimo-gate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: check-all-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/check-all.log
            ${{ runner.temp }}/ultimo-gate.json
          if-no-files-found: warn
          retention-days: 7
      - name: Capture Compose diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci-compose-diagnostics"
          docker compose ps --all > "$RUNNER_TEMP/ci-compose-diagnostics/compose-ps.txt" || true
          docker compose logs --timestamps --no-color > "$RUNNER_TEMP/ci-compose-diagnostics/compose.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-compose-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-compose-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cucumber-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop infrastructure
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Enforce all quality gates
        if: always()
        env:
          DEADCODE_OUTCOME: ${{ steps.deadcode.outcome }}
          FULL_GATE_OUTCOME: ${{ steps.full-gate.outcome }}
        run: |
          test "$DEADCODE_OUTCOME" = success
          test "$FULL_GATE_OUTCOME" = success

  runtime-smoke:
    name: Functional Docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start PostgreSQL, LocalStack, migrations, API and worker
        run: docker compose up --build --detach --wait
      - name: Verify migrations and healthy worker
        run: |
          migrate_id="$(docker compose ps --all -q migrate)"
          worker_id="$(docker compose ps -q worker)"
          test -n "$migrate_id"
          test "$(docker inspect --format '{{.State.Status}}' "$migrate_id")" = exited
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migrate_id")" = 0
          test -n "$worker_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$worker_id")" = healthy
          docker compose ps --all
      - name: Check API readiness
        run: curl --fail --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/health/ready
      - name: Exercise wallet, financial operations, idempotency and reconciliation
        run: bun run demo:finance
        env:
          API_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://wagering:wagering@127.0.0.1:5432/wagering
      - name: Exercise an SQS command and replay
        run: bun run smoke:sqs-worker
        env:
          API_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://wagering:wagering@127.0.0.1:5432/wagering
          SQS_ENDPOINT: http://127.0.0.1:4566
      - name: Verify read-only financial invariants
        run: bun run check:financial-invariants
        env:
          DATABASE_URL: postgresql://wagering:wagering@127.0.0.1:5432/wagering
      - name: Capture runtime diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-smoke-diagnostics"
          docker compose ps --all > "$RUNNER_TEMP/runtime-smoke-diagnostics/compose-ps.txt" || true
          docker compose logs --timestamps --no-color > "$RUNNER_TEMP/runtime-smoke-diagnostics/compose.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runtime-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Stop runtime stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  testcontainers:
    name: Isolated Testcontainers pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run isolated PostgreSQL and SQS integration battery
        run: bun run test:containers
        env:
          TESTCONTAINERS_DIAGNOSTICS_DIR: ${{ runner.temp }}/testcontainers-diagnostics
      - name: Capture Docker diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/testcontainers-diagnostics"
          docker ps -a --no-trunc > "$RUNNER_TEMP/testcontainers-diagnostics/docker-ps.txt" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: testcontainers-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testcontainers-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  protected-edge:
    name: Protected mode edge checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: protected-${{ github.run_id }}-${{ github.run_attempt }}
      EDGE_NETWORK: protected-${{ github.run_id }}-${{ github.run_attempt }}_default
      EDGE_DIAGNOSTICS_DIR: ${{ runner.temp }}/protected-edge-diagnostics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Select a free loopback port
        run: |
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          printf 'EDGE_HOST_PORT=%s\n' "$port" >> "$GITHUB_ENV"
      - name: Run protected mode checks
        run: bun run edge:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: protected-edge-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/protected-edge-diagnostics
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build API image for scanning
        id: build-image
        run: docker build -t wagering-api:ci .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wagering-api:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-image-results.json
          exit-code: '1'
      - name: Generate CycloneDX image SBOM
        if: always() && steps.build-image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wagering-api:ci
          format: cyclonedx
          output: image-sbom.cyclonedx.json
      - name: Scan repository dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-fs-results.json
          exit-code: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: trivy-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            trivy-*-results.json
            image-sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: 30
