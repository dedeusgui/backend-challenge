# Publishes the static showcase (site/) to GitHub Pages. The page reads no service at run time.
# Enabling it needs one repository setting: Settings > Pages > Source > "GitHub Actions". Until that is set,
# the build job still runs and the deploy job fails on purpose, so nothing is published by accident.
name: Static showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The page lists the commits of the review round, so it needs the history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Build the showcase
        run: bun run site:build
        env:
          SITE_BRANCH: ${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
