# Protected mode: an Nginx edge in front of the API, with per-client rate and connection limits.
#
#   docker compose -f docker-compose.yml -f docker-compose.protected.yml up --build
#
# The API is not published in this mode, so the edge is the only way in. The public port defaults to 3000
# so the examples in the README work in both modes; EDGE_HOST_PORT selects a free port when needed.
# Limits are per client address, and a benchmark may raise them with the variables below.
# In this mode PostgreSQL and LocalStack publish no port either: the edge is the only host entry, and it
# binds PUBLISH_HOST (127.0.0.1 by default). The database and the queue stay on the internal network.

x-edge-limits: &edge-limits
  EDGE_WRITE_RATE: ${EDGE_WRITE_RATE:-20r/s}
  EDGE_WRITE_BURST: ${EDGE_WRITE_BURST:-40}
  EDGE_READ_RATE: ${EDGE_READ_RATE:-50r/s}
  EDGE_READ_BURST: ${EDGE_READ_BURST:-100}
  EDGE_MAX_CONNECTIONS: ${EDGE_MAX_CONNECTIONS:-50}

services:
  api:
    ports: !reset []
    expose:
      - '3000'

  postgres:
    ports: !reset []

  localstack:
    ports: !reset []

  edge:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
    environment: *edge-limits
    ports:
      - '${PUBLISH_HOST:-127.0.0.1}:${EDGE_HOST_PORT:-3000}:8080'
    volumes:
      - ./docker/edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/edge/proxy.conf:/etc/nginx/edge/proxy.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-Y', 'off', '-q', '-O', '-', 'http://127.0.0.1:8080/health/live']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
