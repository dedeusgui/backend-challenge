# Local stack: PostgreSQL, LocalStack (SQS), a one-shot migration, the HTTP API and the worker.
# Start order is enforced: the database and queues are healthy, then the schema is migrated,
# then the API and the worker start. Credentials below are local development values only.

x-app-environment: &app-environment
  DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_ENDPOINT: http://localstack:4566
  SQS_COMMAND_QUEUE: wager-transactions.fifo
  SQS_COMMAND_DLQ: wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE: wager-events.fifo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 5s
      timeout: 3s
      retries: 15

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ['bun', 'run', 'db:migrate']
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    environment:
      <<: *app-environment
      PORT: '3000'
    ports:
      - '3000:3000'
    # A crashed process is restarted. `docker stop` still stops it for good.
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  worker:
    build: .
    command: ['bun', 'run', 'src/worker.ts']
    environment: *app-environment
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
